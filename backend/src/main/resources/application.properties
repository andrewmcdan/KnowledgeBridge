spring.application.name=knowledgebridge

# File output (console stays on by default)
logging.file.name=logs/knowledgebridge.log

# Rotation
logging.logback.rollingpolicy.file-name-pattern=logs/knowledgebridge.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# Levels
logging.level.root=INFO
logging.level.com.capstone.knowledgebridge=DEBUG

# JWT signing. Override KNOWLEDGEBRIDGE_JWT_SECRET in .env; the default is for local development only.
knowledgebridge.jwt.secret=${KNOWLEDGEBRIDGE_JWT_SECRET:change-me-local-development-secret-at-least-32-bytes}
knowledgebridge.jwt.ttl=${KNOWLEDGEBRIDGE_JWT_TTL:PT8H}

# gbrain adapter. Credentials come from scripts/provision-gbrain.ps1 via the root .env.
knowledgebridge.gbrain.enabled=${GBRAIN_ENABLED:true}
knowledgebridge.gbrain.base-url=${GBRAIN_BASE_URL:http://localhost:3131}
knowledgebridge.gbrain.oauth-client-id=${GBRAIN_OAUTH_CLIENT_ID:}
knowledgebridge.gbrain.oauth-client-secret=${GBRAIN_OAUTH_CLIENT_SECRET:}
knowledgebridge.gbrain.oauth-token-url=${GBRAIN_OAUTH_TOKEN_URL:http://localhost:3131/token}
knowledgebridge.gbrain.connect-timeout=${GBRAIN_CONNECT_TIMEOUT:PT2S}
knowledgebridge.gbrain.read-timeout=${GBRAIN_READ_TIMEOUT:PT30S}
knowledgebridge.gbrain.synthesis-timeout=${GBRAIN_SYNTHESIS_TIMEOUT:PT120S}
knowledgebridge.gbrain.max-response-size=${GBRAIN_MAX_RESPONSE_SIZE:4MB}
knowledgebridge.gbrain.retry-max-attempts=${GBRAIN_RETRY_MAX_ATTEMPTS:3}
knowledgebridge.gbrain.retry-max-backoff=${GBRAIN_RETRY_MAX_BACKOFF:PT5S}
# mcp indexes content in gbrain; in-memory is a local stand-in when gbrain is unavailable.
knowledgebridge.gbrain.mode=${GBRAIN_MODE:mcp}

# Markdown uploads are still limited by gbrain's 1MB body limit. Video uploads have a separate,
# configurable validation limit; the servlet envelope must be at least as large as that limit.
spring.servlet.multipart.max-file-size=${KNOWLEDGEBRIDGE_VIDEO_MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${KNOWLEDGEBRIDGE_VIDEO_MAX_REQUEST_SIZE:501MB}

# Video ingestion. Uploads are kept here only until their transcript is durably stored.
knowledgebridge.video.storage-directory=${KNOWLEDGEBRIDGE_VIDEO_STORAGE_DIRECTORY:data/uploads}
knowledgebridge.video.max-upload-size=${KNOWLEDGEBRIDGE_VIDEO_MAX_UPLOAD_SIZE:500MB}
knowledgebridge.video.max-duration=${KNOWLEDGEBRIDGE_VIDEO_MAX_DURATION:PT2H}
knowledgebridge.video.segment-duration=${KNOWLEDGEBRIDGE_VIDEO_SEGMENT_DURATION:PT20M}
knowledgebridge.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
knowledgebridge.video.ffprobe-path=${FFPROBE_PATH:ffprobe}

# OpenAI speech-to-text. OPENAI_API_KEY has no default so transcription fails safely when unset.
knowledgebridge.transcription.api-key=${OPENAI_API_KEY:}
knowledgebridge.transcription.base-url=${OPENAI_TRANSCRIPTION_BASE_URL:https://api.openai.com/v1}
knowledgebridge.transcription.model=${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
knowledgebridge.transcription.timeout=${OPENAI_TRANSCRIPTION_TIMEOUT:PT5M}

# The worker is deliberately bounded so large media jobs cannot exhaust request threads or memory.
knowledgebridge.ingestion.worker-count=${KNOWLEDGEBRIDGE_INGESTION_WORKER_COUNT:2}
knowledgebridge.ingestion.queue-capacity=${KNOWLEDGEBRIDGE_INGESTION_QUEUE_CAPACITY:20}
