services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledgebridge}
      POSTGRES_USER: ${POSTGRES_USER:-knowledgebridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledgebridge}
      GBRAIN_DB_PASSWORD: ${GBRAIN_DB_PASSWORD:-gbrain-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-gbrain.sh:/docker-entrypoint-initdb.d/10-gbrain.sh:ro

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowledgebridge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-knowledgebridge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-knowledgebridge}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      KNOWLEDGEBRIDGE_JWT_SECRET: ${KNOWLEDGEBRIDGE_JWT_SECRET:-change-me-local-development-secret-at-least-32-bytes}
      KNOWLEDGEBRIDGE_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KNOWLEDGEBRIDGE_VIDEO_STORAGE_DIRECTORY: /data/uploads
      KNOWLEDGEBRIDGE_VIDEO_MAX_UPLOAD_SIZE: ${KNOWLEDGEBRIDGE_VIDEO_MAX_UPLOAD_SIZE:-500MB}
      KNOWLEDGEBRIDGE_VIDEO_MAX_REQUEST_SIZE: ${KNOWLEDGEBRIDGE_VIDEO_MAX_REQUEST_SIZE:-501MB}
      KNOWLEDGEBRIDGE_VIDEO_MAX_DURATION: ${KNOWLEDGEBRIDGE_VIDEO_MAX_DURATION:-PT2H}
      KNOWLEDGEBRIDGE_VIDEO_SEGMENT_DURATION: ${KNOWLEDGEBRIDGE_VIDEO_SEGMENT_DURATION:-PT20M}
      KNOWLEDGEBRIDGE_INGESTION_WORKER_COUNT: ${KNOWLEDGEBRIDGE_INGESTION_WORKER_COUNT:-2}
      KNOWLEDGEBRIDGE_INGESTION_QUEUE_CAPACITY: ${KNOWLEDGEBRIDGE_INGESTION_QUEUE_CAPACITY:-20}
      OPENAI_TRANSCRIPTION_BASE_URL: ${OPENAI_TRANSCRIPTION_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_TRANSCRIPTION_TIMEOUT: ${OPENAI_TRANSCRIPTION_TIMEOUT:-PT5M}
      # Consumed by the backend gbrain adapter (knowledgebridge.gbrain.*).
      GBRAIN_BASE_URL: http://gbrain:3131
      GBRAIN_OAUTH_CLIENT_ID: ${GBRAIN_OAUTH_CLIENT_ID:-}
      GBRAIN_OAUTH_CLIENT_SECRET: ${GBRAIN_OAUTH_CLIENT_SECRET:-}
      GBRAIN_EXTRACTION_OAUTH_CLIENT_ID: ${GBRAIN_EXTRACTION_OAUTH_CLIENT_ID:-}
      GBRAIN_EXTRACTION_OAUTH_CLIENT_SECRET: ${GBRAIN_EXTRACTION_OAUTH_CLIENT_SECRET:-}
      GBRAIN_OAUTH_TOKEN_URL: http://gbrain:3131/token
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - backend-upload-data:/data/uploads

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  gbrain:
    build:
      context: ./docker/gbrain
    environment:
      GBRAIN_HOME: /data
      GBRAIN_DATABASE_URL: postgres://gbrain:${GBRAIN_DB_PASSWORD:-gbrain-local}@postgres:5432/gbrain
      # Empty model values let docker/gbrain/entrypoint.sh pick defaults for the available provider key.
      GBRAIN_EMBEDDING_MODEL: ${GBRAIN_EMBEDDING_MODEL:-}
      GBRAIN_EMBEDDING_DIMENSIONS: ${GBRAIN_EMBEDDING_DIMENSIONS:-1536}
      GBRAIN_SYNTHESIS_MODEL: ${GBRAIN_SYNTHESIS_MODEL:-}
      # Set at least one key; OpenRouter is used when both are present.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER:-http://localhost:3000}
      OPENROUTER_TITLE: ${OPENROUTER_TITLE:-KnowledgeBridge}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GBRAIN_PORT:-3131}:3131"
    volumes:
      - gbrain-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3131/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

volumes:
  postgres-data:
  gbrain-data:
  backend-upload-data:
